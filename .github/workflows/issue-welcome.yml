name: Issue — Welcome & Label

on:
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Apply user-replied label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['user-replied']
            });

      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const repoName = context.repo.repo;

            const body = [
              `Hey @${author}, your filing has been received. 🏛️`,
              ``,
              `@TheCodingDad-TisonK has been notified and will review your case as soon as possible. No late fees — we promise.`,
              ``,
              `**To help process your report quickly, please confirm:**`,
              ``,
              `- [ ] You are running the latest version of Tax Mod (visible in the mod manager)`,
              `- [ ] Your issue includes the relevant \`[TaxMod]\` lines from \`log.txt\``,
              `  - Log location: \`Documents/My Games/FarmingSimulator2025/log.txt\``,
              `  - Search for \`[TaxMod]\` and paste the relevant section here`,
              `- [ ] If this involves a specific tax bracket, deduction, or rate — note the expected value and what the mod actually applied`,
              `- [ ] You have searched [existing issues](https://github.com/${context.repo.owner}/${repoName}/issues) for a similar report`,
              ``,
              `> **Note:** Issues without a log snippet are difficult to investigate and may be closed. Tax calculation errors are especially hard to reproduce without log data.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
